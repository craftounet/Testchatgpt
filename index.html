<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mini calculatrice</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--muted:#9eacc2;--accent:#8bd3ff;--key:#24334a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0%,#294566 0,transparent 42%),var(--bg);color:#f5f7fb;font:16px/1.4 system-ui,-apple-system,sans-serif}
    main{width:min(420px,100%)}
    .intro{text-align:center;margin-bottom:18px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;font-weight:750}
    h1{font-size:clamp(1.8rem,7vw,2.6rem);letter-spacing:-.05em;margin:4px 0}.intro p{color:var(--muted);margin:0;font-size:.9rem}
    .calculator{padding:18px;background:linear-gradient(145deg,#1b2940,#111a29);border:1px solid #ffffff1b;border-radius:26px;box-shadow:0 24px 70px #0006}
    .screen{min-height:100px;padding:12px 10px 16px;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
    #expression{color:var(--muted);font-size:.9rem;min-height:24px;overflow-wrap:anywhere}
    #display{font-size:clamp(2.2rem,10vw,3.3rem);font-weight:650;letter-spacing:-.06em;overflow-wrap:anywhere;line-height:1.15}
    .keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
    button{border:0;border-radius:15px;min-width:0;min-height:58px;background:var(--key);color:#f5f7fb;font:600 1.2rem system-ui;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button:active{filter:brightness(1.35);transform:scale(.97)}
    button.utility{color:var(--accent);background:#263c54}button.operator{background:#30445e;color:#a9ddff}
    button.equals{background:linear-gradient(135deg,#6fc6f5,#8bd3ff);color:#102033}
    button.zero{grid-column:span 2}
    .hint{text-align:center;color:#8392a9;font-size:.76rem;margin:14px 0 0}

    .weather-card{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;align-items:center;margin:0 0 14px;padding:14px;background:linear-gradient(135deg,#243d59,#17263a);border:1px solid #ffffff20;border-radius:22px;box-shadow:0 14px 38px #0004;overflow:hidden}
    .weather-copy{min-width:0}.weather-place{font-size:.76rem;color:#b9cbe0;font-weight:650;letter-spacing:.04em}.weather-temp{font-size:2.3rem;line-height:1.1;font-weight:750;letter-spacing:-.06em;margin:4px 0}.weather-desc{font-size:.88rem;color:#e0eaf5}.weather-meta{font-size:.72rem;color:#b4c5d9;margin-top:8px}.weather-cat{width:112px;height:112px;object-fit:cover;border-radius:16px;background:#344b63}.weather-credit{font-size:.65rem;color:#91a5bd;margin-top:5px}
    @media(max-width:380px){.weather-card{grid-template-columns:minmax(0,1fr) 88px;gap:9px;padding:11px;border-radius:18px}.weather-cat{width:88px;height:88px}.weather-temp{font-size:2rem}}
    /* Téléphones compacts */
    @media(max-width:380px){body{padding:12px}.calculator{padding:13px;border-radius:20px}.keys{gap:7px}button{min-height:52px;border-radius:12px}}
    /* Montres et très petits écrans : priorité aux commandes tactiles */
    @media(max-width:240px), (max-height:360px) and (max-width:320px){
      body{padding:env(safe-area-inset-top,6px) 7px env(safe-area-inset-bottom,6px);place-items:center;background:var(--bg)}
      main{width:100%;max-width:230px}
      .intro{margin:0 0 5px}
      .weather-card{grid-template-columns:minmax(0,1fr) 50px;gap:5px;padding:7px;margin-bottom:7px;border-radius:13px}
      .weather-cat{width:50px;height:50px;border-radius:9px}
      .weather-temp{font-size:1.45rem;margin:2px 0}
      .weather-place{font-size:.62rem}.weather-desc{font-size:.68rem}.weather-meta,.weather-credit{display:none}
      .eyebrow,.intro p,.hint{display:none}
      h1{font-size: .9rem;letter-spacing:0;margin:0 0 4px}
      .calculator{padding:8px;border-radius:18px;box-shadow:none}
      .screen{min-height:55px;padding:3px 5px 8px}
      #expression{font-size:.68rem;min-height:16px}
      #display{font-size:clamp(1.65rem,13vw,2.2rem);line-height:1.05}
      .keys{gap:5px}
      button{min-height:clamp(34px,11vw,43px);border-radius:11px;font-size:1rem}
    }
    @media(hover:none){button:hover{filter:none}}
  </style>
</head>
<body>
<main>
  <header class="intro"><div class="eyebrow">Outil rapide</div><h1>Mini calculatrice</h1><p>Simple, rapide et toujours à portée de main.</p></header>
  <section class="weather-card" aria-label="Météo actuelle à Rouen">
    <div class="weather-copy">
      <div class="weather-place">MÉTÉO · ROUEN</div>
      <div class="weather-temp" id="weather-temp">--°</div>
      <div class="weather-desc" id="weather-desc">Chargement de la météo…</div>
      <div class="weather-meta" id="weather-meta">Température ressentie et vent en direct</div>
      <div class="weather-credit">Données météo : Open-Meteo</div>
    </div>
    <img class="weather-cat" src="https://cataas.com/cat?width=320&height=320" alt="Portrait d’un chat" loading="lazy">
  </section>
  <section class="calculator" aria-label="Calculatrice">
    <div class="screen" aria-live="polite"><div id="expression"></div><div id="display">0</div></div>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="Tout effacer">AC</button><button class="utility" data-action="sign" aria-label="Changer le signe">+/−</button><button class="utility" data-action="percent">%</button><button class="operator" data-op="÷">÷</button>
      <button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button><button class="operator" data-op="×">×</button>
      <button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button class="operator" data-op="−">−</button>
      <button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button class="operator" data-op="+">+</button>
      <button class="zero" data-number="0">0</button><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
    </div>
  </section>
  <p class="hint">Clavier compatible · Échap pour effacer · Entrée pour calculer</p>
</main>
<script>
(()=>{
 const display=document.querySelector('#display'),expression=document.querySelector('#expression');
 const weatherText=code=>{if(code===0)return 'Ciel dégagé';if([1,2].includes(code))return 'Peu nuageux';if(code===3)return 'Couvert';if([45,48].includes(code))return 'Brouillard';if([51,53,55,56,57].includes(code))return 'Bruine';if([61,63,65,66,67,80,81,82].includes(code))return 'Pluie';if([71,73,75,77,85,86].includes(code))return 'Neige';if([95,96,99].includes(code))return 'Orages';return 'Conditions variables';};
 fetch('https://api.open-meteo.com/v1/forecast?latitude=49.4431&longitude=1.0993&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Europe%2FParis')
  .then(r=>{if(!r.ok)throw new Error('Météo indisponible');return r.json();})
  .then(data=>{const w=data.current;document.querySelector('#weather-temp').textContent=Math.round(w.temperature_2m)+'°';document.querySelector('#weather-desc').textContent=weatherText(w.weather_code);document.querySelector('#weather-meta').textContent='Ressenti '+Math.round(w.apparent_temperature)+'° · Vent '+Math.round(w.wind_speed_10m)+' km/h';})
  .catch(()=>{document.querySelector('#weather-desc').textContent='Météo momentanément indisponible';document.querySelector('#weather-meta').textContent='Réessaie dans un instant';});
 let current='0',stored=null,operator=null,waiting=false,justSolved=false;
 const render=()=>{display.textContent=current;};
 const clean=n=>{if(!Number.isFinite(n))return 'Erreur';return String(Number.parseFloat(n.toPrecision(12)));};
 const reset=()=>{current='0';stored=null;operator=null;waiting=false;justSolved=false;expression.textContent='';render();};
 const calculate=(a,b,op)=>{switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b;default:return b;}};
 const inputNumber=n=>{if(current==='Erreur')reset();if(waiting||justSolved){current=n;waiting=false;justSolved=false;}else if(current==='0')current=n;else if(current.replace('-','').length<14)current+=n;render();};
 const chooseOp=op=>{if(current==='Erreur')return;const value=Number(current);if(operator&&!waiting){const result=calculate(stored,value,operator);current=clean(result);stored=Number(current);}else stored=value;operator=op;waiting=true;justSolved=false;expression.textContent=current+' '+op;render();};
 const equals=()=>{if(operator===null||stored===null||current==='Erreur')return;const a=stored,b=Number(current),op=operator,result=calculate(a,b,op);expression.textContent=clean(a)+' '+op+' '+clean(b)+' =';current=clean(result);stored=null;operator=null;waiting=true;justSolved=true;render();};
 const action=a=>{if(a==='clear')reset();else if(a==='decimal'){if(current==='Erreur')reset();if(waiting||justSolved){current='0.';waiting=false;justSolved=false;}else if(!current.includes('.'))current+='.';render();}else if(a==='sign'){if(current!=='0'&&current!=='Erreur')current=current.startsWith('-')?current.slice(1):'-'+current;render();}else if(a==='percent'){if(current!=='Erreur'){current=clean(Number(current)/100);render();}}else if(a==='equals')equals();};
 document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.number!==undefined)inputNumber(b.dataset.number);else if(b.dataset.op)chooseOp(b.dataset.op);else if(b.dataset.action)action(b.dataset.action);});
 document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){inputNumber(e.key);return;}if(e.key==='.')action('decimal');else if(e.key==='Enter'||e.key==='='){e.preventDefault();equals();}else if(e.key==='Escape'||e.key==='Delete')reset();else if(e.key==='Backspace'){if(!waiting&&current!=='Erreur'){current=current.length>1?current.slice(0,-1):'0';if(current==='-')current='0';render();}}else{const ops={'+':'+','-':'−','*':'×','/':'÷'};if(ops[e.key]){e.preventDefault();chooseOp(ops[e.key]);}}});
})();
</script>
</body>
</html>
